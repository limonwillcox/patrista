name: Deploy Cloudflare Pages

# The site is built here and uploaded to the Cloudflare Pages project "patrista" with Wrangler.
# Wrangler uploads only files that changed, so a deploy does not copy the whole site each time.
# Secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit), CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Empty until the secret is added: the deploy step is skipped instead of failing.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Cloudflare token missing
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy to Cloudflare Pages. Skipping."
      - if: env.HAS_CF_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_CF_TOKEN == 'true'
        uses: pnpm/action-setup@v4
      - if: env.HAS_CF_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: env.HAS_CF_TOKEN == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_CF_TOKEN == 'true'
        run: pnpm build
        env:
          VITE_DONATE_API_BASE: ${{ vars.VITE_DONATE_API_BASE }}
      - if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=patrista --branch=main --commit-dirty=true
