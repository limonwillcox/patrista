# Donate checkout + Fixes → GitHub Issues + API.Bible chapter proxy.
# The public site stays on GitHub Pages.
# Do not attach dist/ as assets: Cloudflare rejects the SPA _redirects file.
# Secrets: STRIPE_SECRET_KEY, GITHUB_TOKEN (issues + contents:write on limonwillcox/piblia),
#          BIBLE_API_KEY (API.Bible — keep server-side; never VITE_)
name = "piblia"
main = "server/donate-worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
DONATE_PUBLIC_ORIGIN = "https://patrista.com"

[[kv_namespaces]]
binding = "FIXES_KV"
id = "49d0718051434b8791afc06d9aa96ef1"
preview_id = "8c8de87185c443fb8f44eff727765922"

# Clavis catalogue (D1). Uncomment after: npx wrangler d1 create patrista-clavis
# Bodies do not go in this database. Apply data/clavis/schema.sql with wrangler d1 execute.
# [[d1_databases]]
# binding = "CLAVIS_DB"
# database_name = "patrista-clavis"
# database_id = ""

# Clavis text bodies (R2). Uncomment after: npx wrangler r2 bucket create patrista-clavis-texts
# Object key: clavis/texts/{work_id}/{language}.txt
# [[r2_buckets]]
# binding = "CLAVIS_TEXTS"
# bucket_name = "patrista-clavis-texts"
